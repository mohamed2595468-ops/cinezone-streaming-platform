<body>

    <nav class="navbar">
        <a href="index.html" class="logo">CineZone</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>

    <!--contact-->

    <section class="contact-container">
        <h2 class="section-title">Get In Touch</h2>
        <p class="contact-subtitle">Have a question, feedback, or suggestion? Send us a message!</p>

        <form class="contact-form" action="#" method="POST">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter Your Full Name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Addres</label>
                <input type="email" id="email" name="email" placeholder="email@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="What Is This Regarding?" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Write Your Message Here..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Send Message</button>


        </form>
    </section>
